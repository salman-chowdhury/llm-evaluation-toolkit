name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: llm-eval evaluate examples/sample.jsonl --output-dir reports/sample
      - uses: actions/upload-artifact@v4
        with:
          name: sample-evaluation-report
          path: reports/sample
          if-no-files-found: error
